{% extends "base.html" %}{% block title %}My profile — WonderLove{% endblock %}{% block content %}<section class="form-wrap"><div class="form-intro"><h1>Your profile</h1><p>Help others get to know you.</p></div><form method="post" enctype="multipart/form-data" class="card form-card">{% if user.photo %}<img class="profile-photo-large" src="{{ url_for('static', filename=user.photo) }}" alt="Your profile photo">{% endif %}<label>Profile picture<input type="file" name="photo" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp"><small>JPG, PNG or WEBP; maximum 3 MB.</small></label><div class="field-grid"><label>Display name<input name="name" value="{{ user.name }}" maxlength="60" required></label><label>Age<input value="{{ age }}" disabled></label></div><label>Country<input name="country" value="{{ user.country }}" required></label><label>About me<textarea name="bio" maxlength="500" rows="4" placeholder="Tell people a little about yourself">{{ user.bio }}</textarea></label><label>Interests<textarea name="interests" maxlength="300" rows="2" placeholder="Music, films, travel…">{{ user.interests }}</textarea></label><label>Relationship intentions<input name="intentions" maxlength="200" value="{{ user.intentions }}" placeholder="What kind of connection are you looking for?"></label><label>Who would you like to meet?<select name="looking_for"><option value="Everyone" {% if user.looking_for=='Everyone' %}selected{% endif %}>Everyone</option><option value="Male" {% if user.looking_for=='Male' %}selected{% endif %}>Male</option><option value="Female" {% if user.looking_for=='Female' %}selected{% endif %}>Female</option></select></label><label>Preferred language<select name="language">{% for code,name in langs.items() %}<option value="{{ code }}" {% if user.language==code %}selected{% endif %}>{{ name }}</option>{% endfor %}</select></label><button class="button full">{{ t.save }}</button><p><a href="{{ url_for('delete_account') }}">Delete my account</a></p></form></section>{% endblock %}
